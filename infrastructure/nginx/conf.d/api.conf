# Backend API server block
upstream api {
    server api:3001;
}

server {
    listen 80;
    server_name api.aria-erp.com api.localhost;
    client_max_body_size 20M;

    # API routes. GAP-ENV-1: the application owns CORS (strict allow-list with
    # credentials, 403 on a denied origin). The edge MUST NOT add
    # Access-Control-Allow-Origin or short-circuit OPTIONS — a wildcard ACAO
    # combined with the API's credentialed responses is rejected by browsers
    # and would silently replace the API's CORS contract.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Edge health check. The API serves health under its global prefix
    # (/api/v1/health); only /.well-known/jwks.json is unprefixed.
    location = /health {
        proxy_pass http://api/api/v1/health;
        access_log off;
    }

    # Phase 52-ARCH-3C: Core publishes its JWT verification keys at this root-level path, and the
    # `JWT_JWKS_URI` example in `apps/api/.env.example` points external verifiers at it. This
    # server block is the one that answers for `api.aria-erp.com` (an exact name wins over the
    # `*.aria-erp.com` wildcard in frontend.conf), so without a location here the document is
    # served by the API process but 404s at the ingress — a verifier pointed at the documented
    # URL would never reach Core.
    #
    # Exact match, NOT a `/.well-known/` prefix: ACME serves `/.well-known/acme-challenge/` from
    # whatever terminates TLS for this host, and a prefix location here would shadow it.
    location = /.well-known/jwks.json {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Public key material, so a shared cache is harmless — but bounded by the platform's own
        # verifier cache lifetime (`JWKS_CACHE_TTL_MS`, token-keyset.ts) so that no intermediary
        # holds a pre-rotation document longer than a verifier inside this platform would.
        add_header Cache-Control "public, max-age=300" always;
    }

    # Swagger lives at /api/v1/docs and is DISABLED unless ENABLE_SWAGGER is set —
    # it is already covered by the /api/ location above. No dedicated route here.
}
