# Frontend server block
upstream web {
    server web:3000;
}

server {
    listen 80;
    server_name localhost *.aria-erp.com aria-erp.com;
    client_max_body_size 20M;

    # GAP-ENV-1: the default (localhost-facing) server must route the API too,
    # not only the frontend — otherwise http://localhost/api/* 404s at the edge.
    # CORS stays owned by the API: no edge ACAO headers, no OPTIONS short-circuit.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api/api/v1/health;
        access_log off;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Root location - frontend
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Prevent caching of dynamic content
        proxy_no_cache $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Static files with cache
    location ~* ^/(images|icons|fonts|_next/static)/ {
        proxy_pass http://web;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Next.js asset files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://web;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000" always;
        access_log off;
    }
}
